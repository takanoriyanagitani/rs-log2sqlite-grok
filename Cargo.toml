[package]
name = "rs-log2sqlite-grok"
version = "0.1.0"
edition = "2024"

description = "Converts the unstructured logs to sqlite using grok."
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-log2sqlite-grok"
homepage = "https://github.com/takanoriyanagitani/rs-log2sqlite-grok"
documentation = "https://docs.rs/rs-log2sqlite-grok/latest"
keywords = ["grok", "sqlite", "log", "wasi"]

exclude = [
    "log2sqlite-grok.wasm",
    "log2sqlite-grok",
    "log2parsed.wasm",
    "opt.wasm",
]

[[bin]]
name = "log2sqlite-grok"
required-features = ["log2sqlite"]

[[bin]]
name = "log2parsed"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.rusqlite]
version = "0.38"
default-features = false
optional = true
features = [
    "bundled",
]

[dependencies.grok]
version = "2.4"
default-features = false
features = [
    "fancy-regex", # works easy with wasi
]

[dependencies.clap]
version = "4.5"
features = ["derive"]

[features]
log2sqlite = [ "rusqlite" ]
